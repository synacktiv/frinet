permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: release
jobs:
  wheels:
    runs-on: ${{ matrix.runner }}
    name: wheel / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-latest, target: x86_64, smoke: true }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, smoke: true }
          - { platform: macos-x86_64, runner: macos-latest, target: x86_64, smoke: false }
          - { platform: macos-aarch64, runner: macos-latest, target: aarch64, smoke: true }
          - { platform: windows-x86_64, runner: windows-latest, target: x64, smoke: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # tag=v7.1.0
        with:
          python-version: "3.11"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # tag=v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
      - name: Import the wheel
        if: matrix.smoke
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist frinet
          python -c "import frinet, frinet.native"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          name: wheel-${{ matrix.platform }}
          path: dist
  sdist:
    runs-on: ubuntu-latest
    name: sdist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # tag=v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          name: sdist
          path: dist
  publish:
    if: github.event_name == 'release'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    name: publish
    # PyPI trusted publishing: register this repository, workflow (release.yml) and environment
    # (pypi) on https://pypi.org/manage/account/publishing/ before the first release
    environment:
      name: pypi
      url: https://pypi.org/project/frinet/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Release tag matches versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          plugin=$(jq -r .plugin.version frontend/ida-plugin.json)
          python=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          echo "tag=$tag ida-plugin.json=$plugin pyproject.toml=$python"
          [ "$tag" = "$plugin" ] && [ "$tag" = "$python" ]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # tag=v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # tag=v1.14.3
