[workspace]
members = [
    "crates/db",
    "crates/index",
    "crates/cli",
    "crates/fuzz",
    "crates/regex",
    "crates/python",
]
resolver = "3"

[workspace.package]
rust-version = "1.89"

[workspace.dependencies]
frinet-db = { path = "crates/db" }
frinet-index = { path = "crates/index" }
frinet-regex = { path = "crates/regex" }

# indexing
fast_hilbert = "2.1.0"
smallvec = "1.16.3"
memmap2 = "0.9.12"
hashbrown = "0.17.1"
rustc-hash = "2.1.3"
log = "0.4.34"

# trace metadata
serde = "1.0.228"
serde_json = "1.0.149"

# regex search
regex-syntax = "0.8.11"
itertools = "0.15.0"
rayon = "1.12.0"

# cli
clap = "4.6.7"
indicatif = "0.18.6"
env_logger = "0.11.11"

# python bindings
pyo3 = "0.30.1"

# benchmark
criterion = "0.8.2"
rand = "0.10.3"
arbitrary = "1.5.0"
