[package]
name = "frinet-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
frinet-db = { workspace = true }
frinet-index = { workspace = true }
arbitrary = { workspace = true, features = ["derive"] }

[[bin]]
name = "register"
path = "fuzz_targets/register.rs"
test = false
doc = false
bench = false

[[bin]]
name = "memory_writes"
path = "fuzz_targets/memory_writes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "search"
path = "fuzz_targets/search.rs"
test = false
doc = false
bench = false
